server {
    listen 80;
    listen [::]:80;
    server_name api.ventrix.5.129.230.236.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.ventrix.5.129.230.236.nip.io;

    ssl_certificate /etc/letsencrypt/live/api.ventrix.5.129.230.236.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ventrix.5.129.230.236.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
